openapi: 3.0.3
info: {title: Dependencies Valid, version: "1.0"}
paths:
  /valid-dependencies:
    post:
      operationId: testValidDependencies
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                credit_card: {type: number}
                billing_address: {type: string}
              dependencies:
                # Schema dependency - if credit_card is present, the entire object must validate against this schema
                credit_card:
                  properties:
                    billing_address:
                      type: string
                      minLength: 1
                # Property dependency - if name is present, these properties must also be present
                name:
                  - credit_card
                  - billing_address
      responses: {"200": {description: ok}}