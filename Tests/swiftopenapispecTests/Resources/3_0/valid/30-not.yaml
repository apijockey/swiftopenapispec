openapi: 3.0.3
info: {title: Combinators, version: "1.0"}
paths:
  /form:
    post:
      operationId: createShape
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  not:
                    pattern: "^admin$"  # Der Benutzername darf NICHT "admin" sein
                age:
                  type: integer
                  not:
                    maximum: 18  # Das Alter darf NICHT <= 18 sein
      responses: {"200": {description: ok}}
