openapi: 3.0.3
info: {title: Combinators, version: "1.0"}
paths:
  /form:
    post:
      operationId: createShape
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type : object
              properties:
                name:
                  anyOf:
                    - type: string
                      minLength: 5
                    - type : string
                      maxLength: 10
                 not:
                   type: string
                     pattern: "^[0-9]{1,4}$"
                 definitions:
                    positiveInteger:
                      type: integer
                      minimum 0
                     exclusiveMinimum: true
           }
       }
      responses: {"200": {description: ok}}
