openapi: 3.0.3
$self: https://not/supported/before/3.2
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
webhooks:
  eventStream:
    post:
      operationId: onEvent
      summary: Generic event stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventEnvelope"
      responses:
        "200":
          description: OK
info:
  title: Servers
  version: "1.0"
servers:
  - url: /
    description: A default API
paths:
  /ping:
    get:
      operationId: pingServer
      responses: {"200": {description: ok}}
