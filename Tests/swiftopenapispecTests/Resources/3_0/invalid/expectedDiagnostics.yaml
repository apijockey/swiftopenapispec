cases:
  - fixture: "01-minimal-30-missingInfo"
    shouldPass: false
    expected:
      - code: "missingRequired"
        pointer: "/"
        rule: "OAS.RequiredOpenAPIFixedFields"
        severity: "error"
        messageContains: "openapi, info, and paths are required"
    onlyThese: true
  - fixture: "02-minimal-30-missingInfoTitle"
    shouldPass: false
    expected:
      expected:
      - code: "missingRequired"
        pointer: "/info"
        rule: "OAS.RequiredOpenAPIFixedInfoFields"
        severity: "error"
        messageContains: "info element requires 'title' and 'version'."
  - fixture: "02-minimal-30-missingInfoVersion"
    shouldPass: false
    expected:
      expected:
      - code: "missingRequired"
        pointer: "/info"
        rule: "OAS.RequiredOpenAPIFixedInfoFields"
        severity: "error"
        messageContains: "info element requires 'title' and 'version'."
  - fixture: "02-minimal-30-missingPaths"
    shouldPass: false
    expected:
      - code: "missingRequired"
        pointer: "/"
        rule: "OAS.RequiredOpenAPIFixedFields"
        severity: "error"
        messageContains: "openapi, info, and paths are required"
    onlyThese: true
  - fixture: "03-minimal-30-unsupportedV3"
    shouldPass: false
    expected:
      - code: "invalidValue"
        pointer: "/openapi"
        rule: "OAS.UnsupportedVersion3"
        severity: "error"
        messageContains: "unsupported Version"
    onlyThese: true
  - fixture: "03-minimal-30-unsupportedPathName"
    shouldPass: false
    expected:
      - code: "invalidValue"
        pointer: "/paths"
        rule: "OAS.PathsMustStartWithSlashRule"
        severity: "error"
        messageContains: "path must start with a '/'"
  - fixture: "03-minimal-30-unsupportedHTTPMethod"
    shouldPass: false
    expected:
      - code: "invalidValue"
        pointer: "/paths"
        rule: "OAS.SupportedHTTPMethodRule"
        severity: "error"
        messageContains: "http operation not supported"
  - fixture: "03-minimal-30-missingResponse"
    shouldPass: false
    expected:
      - code: "missingResponses"
        pointer: "/"
        rule: "OAS.OperationMustHaveResponses"
        severity: "error"
        messageContains: "Operation must define at least one response."
  - fixture: "03-minimal-30-invalidHTTPStatus"
    shouldPass: false
    expected:
      - code: "invalidValue"
        pointer: "/"
        rule: "OAS.SupportedHTPStatusRule"
        severity: "error"
        messageContains: "is not a valid HTTP status code."
  - fixture: "03-minimal-30-noDescription"
    shouldPass: false
    expected:
      - code: "missingRequired"
        pointer: "/"
        rule: "OAS.ReferencesMustHaveRef"
        severity: "error"
        messageContains: "Response needs a ref or a response object with 'description'"
  - fixture: "06-refcomponentNotResolvable"
    shouldPass: false
    expected:
      - code: "missingRequired"
        pointer: "/"
        rule: "OAS.ReferencesMustHaveRef"
        severity: "error"
        messageContains: "Response needs a ref or a response object with 'description'"
 

