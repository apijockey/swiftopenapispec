cases:
  - fixture: "01-minimal-30-missingInfo"
    shouldPass: false
    expected:
      - code: "missingRequired"
        pointer: "/"
        rule: "OAS.RequiredOpenAPIFixedFields"
        severity: "error"
        messageContains: "openapi, info, and paths are required"
    onlyThese: true
  - fixture: "02-minimal-30-missingInfoTitle"
    shouldPass: false
    expected:
      - code: "missingRequired"
        pointer: "/info"
        rule: "OAS.RequiredOpenAPIFixedInfoFields"
        severity: "error"
        messageContains: "info element requires 'title' and 'version'."
  - fixture: "02-minimal-30-missingInfoVersion"
    shouldPass: false
    expected:
      - code: "missingRequired"
        pointer: "/info"
        rule: "OAS.RequiredOpenAPIFixedInfoFields"
        severity: "error"
        messageContains: "info element requires 'title' and 'version'."
  - fixture: "02-minimal-30-missingPaths"
    shouldPass: false
    expected:
      - code: "missingRequired"
        pointer: "/"
        rule: "OAS.RequiredOpenAPIFixedFields"
        severity: "error"
        messageContains: "openapi, info, and paths are required"
    onlyThese: true
  - fixture: "03-minimal-30-unsupportedV3"
    shouldPass: false
    expected:
      - code: "invalidValue"
        pointer: "/openapi"
        rule: "OAS.UnsupportedVersion3"
        severity: "error"
        messageContains: "unsupported Version"
    onlyThese: true
  - fixture: "03-minimal-30-unsupportedPathName"
    shouldPass: false
    expected:
      - code: "invalidValue"
        pointer: "/paths"
        rule: "OAS.PathsMustStartWithSlashRule"
        severity: "error"
        messageContains: "path must start with a '/'"
  - fixture: "03-minimal-30-unsupportedHTTPMethod"
    shouldPass: false
    expected:
      - code: "invalidValue"
        pointer: "/paths"
        rule: "OAS.SupportedHTTPMethodRule"
        severity: "error"
        messageContains: "http operation not supported"
  - fixture: "03-minimal-30-missingResponse"
    shouldPass: false
    expected:
      - code: "missingResponses"
        pointer: "/"
        rule: "OAS.OperationMustHaveResponses"
        severity: "error"
        messageContains: "The Responses Object MUST contain at least one response code, and it SHOULD be the response for a successful operation call"
  - fixture: "03-minimal-30-invalidHTTPStatus"
    shouldPass: false
    expected:
      - code: "invalidValue"
        pointer: "/"
        rule: "OAS.SupportedHTPStatusRule"
        severity: "error"
        messageContains: "is not a valid HTTP status code."
  - fixture: "03-minimal-30-noDescription"
    shouldPass: false
    expected:
      - code: "missingRequired"
        pointer: "/"
        rule: "OAS.ReferencesMustHaveRef"
        severity: "error"
        messageContains: "Response needs a ref or a response object with 'description'"
  - fixture: "05-response-invalidType"
    shouldPass: false
    expected:
      - code: "invalidType"
        pointer: "/paths/~1create/operations/responses/201/content/application~1json/schema/type"
        rule: "Schema.SupportedTypes"
        severity: "error"
        messageContains: "type 'double' not supported or not recognized in OpenAPI 3.0"
  - fixture: "05-response-invalidPropertyType"
    shouldPass: false
    expected:
      - code: "invalidType"
        pointer: "/paths/~1create/operations/responses/201/content/application~1json/schema/properties/id/type"
        rule: "Schema.SupportedTypes"
        severity: "error"
        messageContains: "type 'double' not supported or not recognized in OpenAPI 3.0"
  - fixture: "06-refcomponentNotResolvable"
    shouldPass: false
    expected:
      - code: "missingRequired"
        pointer: "/"
        rule: "OAS.ReferencesMustHaveRef"
        severity: "error"
        messageContains: "Response needs a ref or a response object with 'description'"
  - fixture: "10-schematests-inconsistentformat"
    shouldPass: false
    expected:
      - code: "invalidValue"
        pointer: "/components/schema/Credit/properties/price"
        rule: "Schema.SupportedFormat"
        severity: "warning"
        messageContains: "format 'float' not predefined for 'string'"
      - code: "invalidValue"
        pointer: "/components/schema/Credit/properties/weight"
        rule: "Schema.SupportedFormat"
        severity: "warning"
        messageContains: "format 'binary' not predefined for 'number'"
  - fixture: "10-schematests-invalidAllOfAnyOf"
    shouldPass: false
    expected:
      - code: "invalidValue"
        pointer: "/components/schema/Pet/AllOf"
        rule: "Schema.AnyOneAllWithObjectArray"
        severity: "error"
        messageContains: "AllOf must contain an array of objects"
      - code: "invalidValue"
        pointer: "/components/schema/Vehicle/AnyOf"
        rule: "Schema.AnyOneAllWithObjectArray"
        severity: "error"
        messageContains: "AnyOf must contain an array of objects"
  - fixture: "10-schematests-wrongformat"
    shouldPass: false
    expected:
      - code: "invalidValue"
        pointer: "/components/schema/User/properties/credit/multipleOf"
        rule: "Schema.MultipleOf"
        severity: "error"
        messageContains: "The value of 'multipleOf' MUST be strictly greater than 0"
  - fixture: "10-schematests-identifiableNullable"
    shouldPass: true
    expected:
    
