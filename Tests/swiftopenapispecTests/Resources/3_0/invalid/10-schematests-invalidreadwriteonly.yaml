openapi: 3.0.3
info:
  title: A property MUST NOT be marked as both readOnly and writeOnly being true. Default value is false.
  version: "1.0.0"
paths:
  /ping:
    get:
      operationId: ping
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                type: object,
                properties: {
                  ok: {
                    type: boolean
                  }
                },
                required: [ok]
              }
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          writeOnly: true
        password:
          type: string
          writeOnly: true
          required: true
        balance:
          type: number
          readOnly: true
          required: true
