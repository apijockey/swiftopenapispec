openapi: 3.0.3
info:
  title: wrong format
  version: "1.0"
paths:
  /ping:
    get:
      operationId: ping
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                type: object,
                properties: {
                  ok: {
                    type: boolean
                  }
                },
                required: [ok]
              }
components:
  schemas:
    User:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "no@email"
        birthday:
          type: string
          format: date-time
          example: "2026-01-32"
        uuid:
          type: string
          format: uuid
          example: "no-uuid"
        credit:
          type: number
          format: float
          multipleOf: 0
        id:
          type: integer
