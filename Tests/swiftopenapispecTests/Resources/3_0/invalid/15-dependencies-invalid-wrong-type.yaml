openapi: 3.0.3
info: {title: Dependencies Invalid Wrong Type, version: "1.0"}
paths:
  /invalid-dependencies:
    post:
      operationId: testInvalidDependenciesWrongType
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
              dependencies:
                # Invalid: dependency value must be an object or array, not string
                name: "invalid_string_value"
                # Invalid: dependency value must be an object or array, not integer
                credit_card: 123
                # Invalid: dependency value must be an object or array, not boolean
                billing_address: true
      responses: {"200": {description: ok}}
