# base
openapi: 3.0.3
info: {title: Minimal 3.0, version: "1.0"}
paths:
  /ping:
    get:
      operationId: ping
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                type: object,
                properties: {
                  ok: {
                    type: boolean
                  }
                },
                required: [ok]
              }
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      oauth2MetadataUrl: https://auth.example.com/oauth2Metadata
      deprecated : true
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          scopes:
            read:pets: Read pets
            write:pets: Write pets
        deviceAuthorization:
          deviceAuthorizationUrl: https://auth.example.com/deviceauthorize
          tokenUrl: https://auth.example.com/tokenurl
          scopes:
            read:pets: Read pets
            write:pets: Write pets
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      

