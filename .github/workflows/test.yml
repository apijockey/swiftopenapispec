name: Swift
on: [push]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests-using-native:
    needs: [soundness]
    strategy:
      fail-fast: false
      matrix:
        buildSystem: ["native", "swiftbuild"]
        linuxSwiftVersion: ['["nightly-main", "nightly-6.2"]', '["nightly-main"]']
        enable_windows_checks: [false]
        exclude:
          - buildSystem: "swiftbuild"
            linuxSwiftVersion: '["nightly-main", "nightly-6.2"]'
          - buildSystem: "swiftbuild"
            enable_windows_checks: false
          - buildSystem: "native"
            linuxSwiftVersion: '["nightly-main"]'
    name: Test (${{ matrix.buildSystem }})
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.2
    with:
      linux_os_versions: '["amazonlinux2", "bookworm", "noble", "jammy", "rhel-ubi9"]'
      linux_swift_versions: ${{ matrix.linuxSwiftVersion }}
      linux_pre_build_command: ./.github/scripts/prebuild.sh
      linux_build_command: 'swift test'
      windows_swift_versions: '["nightly-main"]'
      windows_pre_build_command: 'Invoke-Program .\.github\scripts\prebuild.ps1'
      windows_build_command: 'Invoke-Program swift test'
      enable_windows_checks: ${{ matrix.enable_windows_checks }}
      enable_ios_checks: true
      enable_macos_checks: true
      macos_exclude_xcode_versions: "[{\"xcode_version\": \"16.3\"}, {\"xcode_version\": \"16.4\"}]"
      macos_build_command: 'swift test'

  tests-using-swiftbuild:
    name: Test (all SwiftBuild)
    needs: [soundness]
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.2
    with:
      linux_os_versions: '["amazonlinux2", "bookworm", "noble", "jammy", "rhel-ubi9"]'
      linux_swift_versions: '["nightly-main"]'
      linux_pre_build_command: ./.github/scripts/prebuild.sh
      linux_build_command: 'swift test'
      enable_windows_checks: false
      windows_swift_versions: '["nightly-main"]'
      windows_pre_build_command: 'Invoke-Program .\.github\scripts\prebuild.ps1'
      windows_build_command: 'Invoke-Program swift test'
      enable_ios_checks: true
      enable_macos_checks: true
      macos_exclude_xcode_versions: "[{\"xcode_version\": \"16.3\"}, {\"xcode_version\": \"16.4\"}]"
      macos_build_command: 'swift test'

  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.2
    with:
      license_header_check_project_name: "swiftopenapispec"
      license_header_check_enabled: false
      unacceptable_language_check_enabled: true
      api_breakage_check_enabled: false
      format_check_enabled: false
      shell_check_enabled: false
  windows-test:
    name: Windows Test (winget Swift.Toolchain 6.2.3)
    runs-on: windows-latest
    env:
      SWIFT_VERSION: '6.2.3'
    steps:
      - uses: actions/checkout@v4
      - name: Clean old Swift toolchains
        shell: powershell
        run: |
          Remove-Item -Recurse -Force 'C:\Users\ContainerAdministrator\AppData\Local\Programs\Swift\Toolchains\*' -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force 'C:\Library\Developer\Toolchains\*' -ErrorAction SilentlyContinue
          Write-Host "Old Swift toolchains removed (if present)."
      - name: Ensure winget is available
        shell: powershell
        run: |
          Write-Host "winget location:"
          Get-Command winget -ErrorAction SilentlyContinue | Format-List -Force
          winget --version || Write-Host "winget not available or returned non-zero."
      - name: Install Swift.Toolchain via winget
        shell: powershell
        run: |
          # Install official Swift toolchain package via winget.
          # -e / --exact anchors to the package id; accept agreements to avoid prompts.
          Write-Host "Installing Swift.Toolchain (version: $env:SWIFT_VERSION) via winget..."
          winget install --id Swift.Toolchain -e --accept-package-agreements --accept-source-agreements
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            Write-Host "winget install returned exit code $rc"
            exit $rc
          }
      - name: Locate swift and add to PATH if necessary
        shell: powershell
        run: |
          # Check whether swift is already on PATH
          $where = & where.exe swift 2>$null
          if ($where) {
            Write-Host "swift found by where.exe:"
            $where | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "swift not found by where.exe — searching common install locations..."
            $candidates = @(
              "$env:LOCALAPPDATA\Programs\Swift\Toolchains",
              "C:\Users\ContainerAdministrator\AppData\Local\Programs\Swift\Toolchains",
              "C:\Library\Developer\Toolchains",
              "$env:ProgramFiles\Swift"
            )
            $found = $null
            foreach ($p in $candidates) {
              if (Test-Path $p) {
                Get-ChildItem $p -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                  $bin = Join-Path $_.FullName 'usr\bin'
                  if (Test-Path $bin) {
                    Write-Host "Found candidate bin: $bin"
                    # Add to PATH for subsequent steps
                    Add-Content -Path $Env:GITHUB_PATH -Value $bin
                    $found = $true
                  }
                }
              }
            }
            if (-not $found) {
              Write-Host "No swift binary found in expected install locations. Listing C:\\ for quick inspection (limited):"
              Get-ChildItem 'C:\' -Directory -ErrorAction SilentlyContinue | Select-Object -First 20 | Format-List Name
            } else {
              Write-Host "Added detected swift bin to PATH (via GITHUB_PATH)."
            }
          }
      - name: Verify swift and environment
        shell: powershell
        run: |
          Write-Host "=== where swift ==="
          where.exe swift || Write-Host "where.exe did not find swift"
          Write-Host "=== swift --version ==="
          swift --version
          Write-Host "=== swift info (verbose) ==="
          try {
            swift -v --version
          } catch { Write-Host "swift -v --version failed: $_" }
      - name: Build & Test (Windows)
        shell: powershell
        run: |
          Write-Host "Running swift build..."
          swift build -v
          Write-Host "Running swift test..."
      - name: Collect debug info on failure
        if: failure()
        shell: powershell
        run: |
          Write-Host "=== PATH ==="; echo $env:PATH
          Write-Host "=== where swift ==="; where.exe swift || Write-Host "swift not found"
          Write-Host "=== swift --version ==="; swift --version || Write-Host "swift --version failed"
          Write-Host "=== Toolchain folders ==="
          Get-ChildItem 'C:\Users\ContainerAdministrator\AppData\Local\Programs\Swift\Toolchains' -Recurse -Force -ErrorAction SilentlyContinue | Select-Object FullName, Length | Out-String -Width 200 | Write-Host
          Get-ChildItem 'C:\Library\Developer\Toolchains' -Recurse -Force -ErrorAction SilentlyContinue | Select-Object FullName, Length | Out-String -Width 200 | Write-Host
          Get-ChildItem -Path 'C:\' -Filter '*_InternalSwiftScan*.dll' -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Out-String -Width 200 | Write-Host