name: Create Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    if: vars.RUN_LINUX_TESTS == 'true'
    runs-on: ubuntu-latest
    container:
      image: swift:6.0.3-jammy
    needs: [soundness]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift build && swift test
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.2
    with:
      license_header_check_project_name: "Swift"
      license_header_check_enabled: false
      unacceptable_language_check_enabled: true
      api_breakage_check_enabled: false
      format_check_enabled: false
      shell_check_enabled: false
  upload-linux:
    needs: [soundness, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: |
          swift build -c release --product SwiftOpenAPICLI
          strip .build/release/SwiftOpenAPICLI
          mkdir -p linux
          cp .build/release/SwiftOpenAPICLI linux/swiftopenapicli
          shasum -a 256 linux/swiftopenapicli > linux/swiftopenapicli.sha256
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: |
            linux/swiftopenapicli
            linux/swiftopenapicli.sha256
  macos-arm:
    if: vars.RUN_MACOS_TESTS == 'true'
    runs-on: macos-latest
    needs: [soundness]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift build && swift test
  upload-macos-arm:
    needs: [macos-arm]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: |
          swift build -c release --product SwiftOpenAPICLI
          strip .build/release/SwiftOpenAPICLI
          mkdir -p macos-arm
          cp .build/release/SwiftOpenAPICLI macos-arm/swiftopenapicli
          shasum -a 256 macos-arm/swiftopenapicli > macos-arm/swiftopenapicli.sha256
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-cli
          path: |
            macos-arm/swiftopenapicli
            macos-arm/swiftopenapicli.sha256
      - name: Import signing certificate
        run: |
          echo "${{ secrets.MACOS_CERT_P12 }}" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          sudo security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security default-keychain -s build.keychain
          security import cert.p12 -P "${{ secrets.MACOS_CERT_PASSWORD }}" -k build.keychain -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security find-identity -v build.keychain
      - name: List available signing identities
        run: security find-identity -v -p codesigning build.keychain
      - name: Sign binary
        run: |
          codesign --force --deep --options runtime --timestamp --sign "Developer ID Application: CgSe Computergrafik und Softwareentwicklung GmbH (GPW8X6U5Q8)" .build/release/SwiftOpenAPICLI
      - name: Create zip for notarization
        run: ditto -c -k --sequesterRsrc --keepParent .build/release/SwiftOpenAPICLI .build/release/SwiftOpenAPICLI.zip
      - name: Notarize binary
        run: |
         xcrun notarytool submit .build/release/SwiftOpenAPICLI.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{secrets.APPLE_TEAM_ID}}" \
            --wait
      - name: Verify notarization
        run: |
          echo "--- Codesign Verify ---"
          codesign --verify --verbose=4 .build/release/SwiftOpenAPICLI
          echo "--- Gatekeeper Check (CLI tools may fail this) ---"
          if ! spctl -a -t exec -v .build/release/SwiftOpenAPICLI; then
            echo "⚠️ Gatekeeper rejection is normal for CLI tools (not an error)"
          fi
  macos-x86:
    if: vars.RUN_MACOS_TESTS == 'true'
    runs-on: macos-15-intel
    needs: [soundness]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift build && swift test
  upload-macos-x86:
    needs: [soundness, macos-x86]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: |
          swift build -c release --product SwiftOpenAPICLI
          strip .build/release/SwiftOpenAPICLI
          mkdir -p macos-x86
          cp .build/release/SwiftOpenAPICLI macos-x86/swiftopenapicli
          shasum -a 256 macos-x86/swiftopenapicli > macos-x86/swiftopenapicli.sha256
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-cli
          path: |
            macos-x86/swiftopenapicli
            macos-x86/swiftopenapicli.sha256
      - name: Import signing certificate
        run: |
          echo "${{ secrets.MACOS_CERT_P12 }}" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          sudo security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security default-keychain -s build.keychain
          security import cert.p12 -P "${{ secrets.MACOS_CERT_PASSWORD }}" -k build.keychain -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security find-identity -v build.keychain
      - name: List available signing identities
        run: security find-identity -v -p codesigning build.keychain
      - name: Sign binary
        run: |
          codesign --force --deep --options runtime --timestamp --sign "Developer ID Application: CgSe Computergrafik und Softwareentwicklung GmbH (GPW8X6U5Q8)" .build/release/SwiftOpenAPICLI
      - name: Create zip for notarization
        run: ditto -c -k --sequesterRsrc --keepParent .build/release/SwiftOpenAPICLI .build/release/SwiftOpenAPICLI.zip
      - name: Notarize binary
        run: |
         xcrun notarytool submit .build/release/SwiftOpenAPICLI.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{secrets.APPLE_TEAM_ID}}" \
            --wait
      - name: Verify notarization
        run: |
          echo "--- Codesign Verify ---"
          codesign --verify --verbose=4 .build/release/SwiftOpenAPICLI
          echo "--- Gatekeeper Check (CLI tools may fail this) ---"
          if ! spctl -a -t exec -v .build/release/SwiftOpenAPICLI; then
            echo "⚠️ Gatekeeper rejection is normal for CLI tools (not an error)"
          fi
  windows:
    if: vars.RUN_WINDOWS_TESTS == 'true'
    runs-on: windows-latest
    needs: [soundness]
    steps:
      - uses: actions/checkout@v4
      - name: Setup swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Build .exe
        run: |
          swift build -c release --product SwiftOpenAPICLI
           mkdir -p windows
          copy .build/release/SwiftOpenAPICLI.exe windows/swiftopenapicli.exe
          shasum -a 256 windows/swiftopenapicli.exe > windows/swiftopenapicli.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-cli
          path: |
            windows/swiftopenapicli.exe
            windows/swiftopenapicli.sha256
  release:
    needs: [upload-macos-x86, upload-macos-arm, upload-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-cli
          path: linux

      - name: Download macOS ARM
        uses: actions/download-artifact@v4
        with:
          name: macos-arm-cli
          path: macos-arm  # Entpackt nach ./macos-arm/

      - name: Download macOS x86_64
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-cli
          path: macos-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            macos-x86_64/swiftopenapicli
            macos-x86_64/swiftopenapicli.sha256
            linux/swiftopenapicli
            linux/swiftopenapicli.sha256
            macos-arm/swiftopenapicli
            macos-arm/swiftopenapicli.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
