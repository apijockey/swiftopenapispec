name: Create Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.2
    with:
      license_header_check_project_name: "Swift"
      license_header_check_enabled: false
      unacceptable_language_check_enabled: true
      api_breakage_check_enabled: false
      format_check_enabled: false
      shell_check_enabled: false
  linux:
    if: vars.RUN_LINUX_TESTS == 'true'
    runs-on: ubuntu-latest
    container:
      image: swift:6.0.3-jammy
    needs: [soundness]
    steps:
      - uses: actions/checkout@v4
      - name: Test linux x64
        run: swift build && swift test
  linux-arm:
    if: vars.RUN_LINUX_TESTS == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: swift:6.0.3-jammy
    needs: [soundness]
    steps:
      - uses: actions/checkout@v4
      - name: Test linux x64
        run: swift build && swift test
  windows-upload:
    runs-on: ubuntu-latest
    needs: [soundness]
    container:
      image: winamd64/swift:6.2-windowsservercore-ltsc2022
    steps:
      - uses: actions/checkout@v4
      - name: Pull docker image and run test
        run: |
          - name: Pull and run Windows container
        run: |
          docker pull --platform windows winamd64/swift:6.2-windowsservercore-ltsc2022
          docker run --platform windows -v ${PWD}:/src -w /src winamd64/swift:6.2-windowsservercore-ltsc2022 swift build
      - name: Build Release
        run: |
          swift build -c release --product SwiftOpenAPICLI
          strip .build/release/SwiftOpenAPICLI
          swift test
          mkdir -p windows
          cp .build/release/SwiftOpenAPICLI windows/swiftopenapicli¶
          shasum -a 256 windows/swiftopenapicli > windows/swiftopenapicli.sha256
      - name: zip windows
        run: zip -r swiftopenapicli-windows.zip windows
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-cli
          path: swiftopenapicli-windows.zip
  upload-linux:
    needs: [soundness, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: |
          swift build -c release --product SwiftOpenAPICLI
          strip .build/release/SwiftOpenAPICLI
          swift test
          mkdir -p linux
          cp .build/release/SwiftOpenAPICLI linux/swiftopenapicli
          shasum -a 256 linux/swiftopenapicli > linux/swiftopenapicli.sha256
      - name: zip linux
        run: zip -r swiftopenapicli-linux.zip linux
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: swiftopenapicli-linux.zip
  macos-arm:
    if: vars.RUN_MACOS_TESTS == 'true'
    runs-on: macos-latest
    needs: [soundness]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift build && swift test
  upload-macos-arm:
    needs: [macos-arm]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: |
          swift build -c release --product SwiftOpenAPICLI
          strip .build/release/SwiftOpenAPICLI
          swift test
          mkdir -p macos-arm
          cp .build/release/SwiftOpenAPICLI macos-arm/swiftopenapicli
          shasum -a 256 macos-arm/swiftopenapicli > macos-arm/swiftopenapicli.sha256
      - name: Import signing certificate
        run: |
          echo "${{ secrets.MACOS_CERT_P12 }}" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          sudo security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security default-keychain -s build.keychain
          security import cert.p12 -P "${{ secrets.MACOS_CERT_PASSWORD }}" -k build.keychain -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security find-identity -v build.keychain
      - name: Sign binary
        run: |
          codesign --force --deep --options runtime --timestamp --sign "Developer ID Application: CgSe Computergrafik und Softwareentwicklung GmbH (GPW8X6U5Q8)" macos-arm/swiftopenapicli
      - name: Create zip for notarization
        run: ditto -c -k --sequesterRsrc --keepParent macos-arm swiftopenapicli-macos-arm.zip
      - name: Notarize binary
        run: |
         xcrun notarytool submit swiftopenapicli-macos-arm.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{secrets.APPLE_TEAM_ID}}" \
            --wait
      - name: Verify notarization
        run: |
          echo "--- Codesign Verify ---"
          codesign --verify --verbose=4  macos-arm/swiftopenapicli
          echo "--- Gatekeeper Check (CLI tools may fail this) ---"
          if ! spctl -a -t exec -v  macos-arm/swiftopenapicli; then
            echo "⚠️ Gatekeeper rejection is normal for CLI tools (not an error)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm-cli
          path: swiftopenapicli-macos-arm.zip
  macos-x86_64:
    if: vars.RUN_MACOS_TESTS == 'true'
    runs-on: macos-15-intel
    needs: [soundness]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift build && swift test
  upload-macos-x86-64:
    needs: [soundness, macos-x86_64]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: |
          swift build -c release --product SwiftOpenAPICLI
          strip .build/release/SwiftOpenAPICLI
          swift test
          mkdir -p macos-x86_64
          cp .build/release/SwiftOpenAPICLI macos-x86_64/swiftopenapicli
          shasum -a 256 macos-x86_64/swiftopenapicli > macos-x86_64/swiftopenapicli.sha256
      - name: Import signing certificate
        run: |
          echo "${{ secrets.MACOS_CERT_P12 }}" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          sudo security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security default-keychain -s build.keychain
          security import cert.p12 -P "${{ secrets.MACOS_CERT_PASSWORD }}" -k build.keychain -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security find-identity -v build.keychain
      - name: List available signing identities
        run: security find-identity -v -p codesigning build.keychain
      - name: Sign binary
        run: |
          BINARY_PATH="macos-x86_64/swiftopenapicli"
          SIGNING_IDENTITY="Developer ID Application: CgSe Computergrafik und Softwareentwicklung GmbH (GPW8X6U5Q8)"
          TIMESTAMP_SERVERS=(
           "http://timestamp.apple.com/ts01"
           "http://timestamp.apple.com/ts02"
           "http://timestamp.apple.com/ts03"
          )
          for server in "${TIMESTAMP_SERVERS[@]}"; do
            if codesign --force --deep --options runtime --timestamp="$server" --sign "$SIGNING_IDENTITY" macos-x86_64/swiftopenapicli; then
               exit 0
            fi
          done
          echo "::error::no timestamp server available, giving up"
          exit 1
      - name: zip macos X86 64 bit for upload and notarization
        run: ditto -c -k --sequesterRsrc --keepParent macos-x86_64 swiftopenapicli-macos-x86_64.zip
      - name: Notarize binary
        run: |
         xcrun notarytool submit swiftopenapicli-macos-x86_64.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{secrets.APPLE_TEAM_ID}}" \
            --wait
      - name: Verify notarization
        run: |
          echo "--- Codesign Verify ---"
          codesign --verify --verbose=4 macos-x86_64/swiftopenapicli
          echo "--- Gatekeeper Check (CLI tools may fail this) ---"
          if ! spctl -a -t exec -v macos-x86_64/swiftopenapicli; then
            echo "⚠️ Gatekeeper rejection is normal for CLI tools (not an error)"
          fi
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-cli
          path: swiftopenapicli-macos-x86_64.zip
  release:
    needs: [upload-macos-x86-64, upload-macos-arm, upload-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-cli
          path: .

      - name: Download macOS ARM
        uses: actions/download-artifact@v4
        with:
          name: macos-arm-cli
          path: .

      - name: Download macOS x86_64
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-cli
          path: .
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            swiftopenapicli-linux.zip
            swiftopenapicli-macos-arm.zip
            swiftopenapicli-macos-x86_64.zip
