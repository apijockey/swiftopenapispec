name: Create Release

permissions:
  contents: read

on:
  push:
    branches:
      main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    if: vars.RUN_LINUX_TESTS == 'true'
    runs-on: ubuntu-latest
    container:
      image: swift:6.0.3-jammy
    needs: [soundness]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift build && swift test
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.2
    with:
      license_header_check_project_name: "Swift"
      license_header_check_enabled: false
      unacceptable_language_check_enabled: true
      api_breakage_check_enabled: false
      format_check_enabled: false
      shell_check_enabled: false
  upload-linux:
    needs: [soundness, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: |
          swift build -c release --product SwiftOpenAPICLI
          strip .build/release/SwiftOpenAPICLI
          cp .build/release/SwiftOpenAPICLI de
          shasum -a 256 SwiftOpenAPICLI > SwiftOpenAPICLI.sha256
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: |
            SwiftOpenAPICLI
            SwiftOpenAPICLI.sha256
  macos-arm:
    if: vars.RUN_MACOS_TESTS == 'true'
    runs-on: macos-latest
    needs: [soundness]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift build && swift test
  upload-macos-arm:
    needs: [macos-arm]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: |
          swift build -c release --product SwiftOpenAPICLI
          strip .build/release/SwiftOpenAPICLI
          cp .build/release/SwiftOpenAPICLI SwiftOpenAPICLI
          shasum -a 256 SwiftOpenAPICLI > SwiftOpenAPICLI.sha256
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-cli
          path: |
            SwiftOpenAPICLI
            SwiftOpenAPICLI.sha256
      - name: Import signing certificate
        run: |
          echo "${{ secrets.MACOS_CERT_P12 }}" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          sudo security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security default-keychain -s build.keychain
          security import cert.p12 -P "${{ secrets.MACOS_CERT_PASSWORD }}" -k build.keychain -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security find-identity -v build.keychain
      - name: List available signing identities
        run: security find-identity -v -p codesigning build.keychain
      - name: Sign binary
        run: |
          codesign --force --deep --options runtime --timestamp --sign "Developer ID Application: CgSe Computergrafik und Softwareentwicklung GmbH (GPW8X6U5Q8)" .build/release/SwiftOpenAPICLI
      - name: Create zip for notarization
        run: ditto -c -k --sequesterRsrc --keepParent .build/release/SwiftOpenAPICLI .build/release/SwiftOpenAPICLI.zip
      - name: Notarize binary
        run: |
         xcrun notarytool submit .build/release/SwiftOpenAPICLI.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{secrets.APPLE_TEAM_ID}}" \
            --wait
      - name: Staple notarization
        run: |
          echo "--- Stapler Validate ---"
          xcrun stapler validate .build/release/SwiftOpenAPICLI
          echo "--- Authority Check ---"
          codesign -dvvv .build/release/SwiftOpenAPICLI | grep -A1 "Authority"
      - name: Store Notary credentials
        run: |
          xcrun notarytool store-credentials "AC_NOTARY_PROFILE" \
          --apple-id "${{ secrets.APPLE_ID }}" \
          --password "${{ secrets.APPLE_ID_PASSWORD }}" \
          --team-id "${{ secrets.APPLE_TEAM_ID }}"
      - name: Debug notarization
        if: failure()
        run: |
          echo "--- Notarytool History ---"
          xcrun notarytool history \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}"
          echo "--- Extracting Submission ID ---"
          SUBMISSION_ID=$(xcrun notarytool history \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            | grep "SwiftOpenAPICLI" | head -1 | awk '{print $1}')
          if [ -n "$SUBMISSION_ID" ]; then
            echo "Found Submission ID: $SUBMISSION_ID"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --password "${{ secrets.APPLE_ID_PASSWORD }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}"
          else
            echo "❌ No Submission ID found for SwiftOpenAPICLI"
          fi
      - name: Verify notarization
        run: |
          echo "--- Codesign Verify ---"
          codesign --verify --verbose=4 .build/release/SwiftOpenAPICLI
          echo "--- Gatekeeper Check (CLI tools may fail this) ---"
          if ! spctl -a -t exec -v .build/release/SwiftOpenAPICLI; then
            echo "⚠️ Gatekeeper rejection is normal for CLI tools (not an error)"
          fi
  macos-x86:
    if: vars.RUN_MACOS_TESTS == 'true'
    runs-on: macos-15-intel
    needs: [soundness]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift build && swift test
  upload-macos-x86:
    needs: [soundness, macos-x86]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: |
          swift build -c release --product SwiftOpenAPICLI
          strip .build/release/SwiftOpenAPICLI
          cp .build/release/SwiftOpenAPICLI SwiftOpenAPICLI
          shasum -a 256 SwiftOpenAPICLI > SwiftOpenAPICLI.sha256
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-cli
          path: |
            SwiftOpenAPICLI
            SwiftOpenAPICLI.sha256
      - name: Import signing certificate
        run: |
          echo "${{ secrets.MACOS_CERT_P12 }}" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          sudo security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security default-keychain -s build.keychain
          security import cert.p12 -P "${{ secrets.MACOS_CERT_PASSWORD }}" -k build.keychain -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security find-identity -v build.keychain
      - name: List available signing identities
        run: security find-identity -v -p codesigning build.keychain
      - name: Sign binary
        run: |
          codesign --force --deep --options runtime --timestamp --sign "Developer ID Application: CgSe Computergrafik und Softwareentwicklung GmbH (GPW8X6U5Q8)" .build/release/SwiftOpenAPICLI
      - name: Create zip for notarization
        run: ditto -c -k --sequesterRsrc --keepParent .build/release/SwiftOpenAPICLI .build/release/SwiftOpenAPICLI.zip
      - name: Notarize binary
        run: |
         xcrun notarytool submit .build/release/SwiftOpenAPICLI.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{secrets.APPLE_TEAM_ID}}" \
            --wait
      - name: Staple notarization
        run: |
          echo "--- Stapler Validate ---"
          xcrun stapler validate .build/release/SwiftOpenAPICLI
          echo "--- Authority Check ---"
          codesign -dvvv .build/release/SwiftOpenAPICLI | grep -A1 "Authority"
      - name: Store Notary credentials
        run: |
          xcrun notarytool store-credentials "AC_NOTARY_PROFILE" \
          --apple-id "${{ secrets.APPLE_ID }}" \
          --password "${{ secrets.APPLE_ID_PASSWORD }}" \
          --team-id "${{ secrets.APPLE_TEAM_ID }}"
      - name: Debug notarization
        if: failure()
        run: |
          echo "--- Notarytool History ---"
          xcrun notarytool history \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}"
          echo "--- Extracting Submission ID ---"
          SUBMISSION_ID=$(xcrun notarytool history \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            | grep "SwiftOpenAPICLI" | head -1 | awk '{print $1}')
          if [ -n "$SUBMISSION_ID" ]; then
            echo "Found Submission ID: $SUBMISSION_ID"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --password "${{ secrets.APPLE_ID_PASSWORD }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}"
          else
            echo "❌ No Submission ID found for SwiftOpenAPICLI"
          fi
      - name: Verify notarization
        run: |
          echo "--- Codesign Verify ---"
          codesign --verify --verbose=4 .build/release/SwiftOpenAPICLI
          echo "--- Gatekeeper Check (CLI tools may fail this) ---"
          if ! spctl -a -t exec -v .build/release/SwiftOpenAPICLI; then
            echo "⚠️ Gatekeeper rejection is normal for CLI tools (not an error)"
          fi
  windows:
    if: vars.RUN_WINDOWS_TESTS == 'true'
    runs-on: windows-latest
    needs: [soundness]
    steps:
      - uses: actions/checkout@v4
      - name: Setup swift
        uses: swift-actions/setup-swift@v1
        with:
          swift-version: "5.9.2"
      - name: Build .exe
        run: |
          swift build -c release --product SwiftOpenAPICLI
          shasum -a 256 .build\release\SwiftOpenAPICLI.exe > SwiftOpenAPICLI.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-cli
          path: |
            .build\release\SwiftOpenAPICLI.exe
            SwiftOpenAPICLI.sha256
  release:
    needs: [upload-macos-x86, upload-macos-arm, upload-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/macos-x86_64-cli/SwiftOpenAPICLI
            artifacts/macos-x86_64-cli/SwiftOpenAPICLI.sha256
            artifacts/linux-cli/SwiftOpenAPICLI
            artifacts/linux-cli/SwiftOpenAPICLI.sha256
            artifacts/macos-arm-cli/SwiftOpenAPICLI
            artifacts/macos-arm-cli/SwiftOpenAPICLI.sha256
