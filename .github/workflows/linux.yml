name: Swift Linux and MacOS Test

permissions:
  contents: read
on:
  push:
    branches: ["main"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    if: vars.RUN_LINUX_TESTS == 'true'
    runs-on: ubuntu-latest
    container:
      image: swift:6.0.3-jammy
    needs: [soundness]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift build && swift test
  macos:
    if: vars.RUN_MACOS_TESTS == 'true'
    runs-on: macos-latest
    needs: [soundness]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift build && swift test
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.2
    with:
      license_header_check_project_name: "Swift"
      license_header_check_enabled: false
      unacceptable_language_check_enabled: true
      api_breakage_check_enabled: false
      format_check_enabled: false
      shell_check_enabled: false
  release-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [soundness, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: |
          swift build -c release --product SwiftOpenApiCLI
          strip .build/release/SwiftOpenApiCLI
          cp .build/release/SwiftOpenApiCLI SwiftOpenApiCLI-linux
	  shasum -a 256 SwiftOpenAPICLI-linux > SwiftOpenAPICLI-linux.sha256
  release-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [soundness, macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: |
          swift build -c release --product SwiftOpenApiCLI
          strip .build/release/SwiftOpenApiCLI
          cp .build/release/SwiftOpenApiCLI SwiftOpenApiCLI-macos
          shasum -a 256 SwiftOpenAPICLI-macos > SwiftOpenAPICLI-macos.sha256
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-linux, release-macos, wtest]  # wtest = dein Windows-Job
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Binary
        uses: actions/download-artifact@v3
        with:
          name: linux-binary
          path: .
      - name: Download macOS Binary
        uses: actions/download-artifact@v3
        with:
          name: macos-binary
          path: .
      - name: Download Windows Binary
        uses: actions/download-artifact@v3
        with:
          name: windows-binary
          path: .
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            SwiftOpenAPICLI-linux
            SwiftOpenAPICLI-linux.sha256
            SwiftOpenAPICLI-macos
            SwiftOpenAPICLI-macos.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

