name: Swift on Windows
on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.2
    with:
      license_header_check_project_name: "swiftopenapispec"
      license_header_check_enabled: false
      unacceptable_language_check_enabled: true
      api_breakage_check_enabled: false
      format_check_enabled: false
      shell_check_enabled: false

  wtest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        swift: [latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Visual Studio components required by Swift
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Installing Visual Studio components required by Swift..."
          winget install `
            --id Microsoft.VisualStudio.2022.Community `
            --exact `
            --force `
            --accept-source-agreements `
            --accept-package-agreements `
            --custom "--add Microsoft.VisualStudio.Component.Windows11SDK.22621 --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.VC.Tools.ARM64"

      - name: Install Microsoft Visual C++ Runtime (direct installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
      
          function Run-Redist($url, $name) {
            $out = Join-Path $env:TEMP $name
            Invoke-WebRequest -Uri $url -OutFile $out
      
            Write-Host "Running $name /repair ..."
            $p = Start-Process -FilePath $out -ArgumentList "/repair", "/quiet", "/norestart" -Wait -PassThru
            Write-Host "$name exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "$name failed with exit code $($p.ExitCode)" }
          }
      
          Run-Redist "https://aka.ms/vs/17/release/vc_redist.x64.exe" "vc_redist.x64.exe"
          Run-Redist "https://aka.ms/vs/17/release/vc_redist.x86.exe" "vc_redist.x86.exe"
      
          # Verify immediately
          $system32 = Join-Path $env:WINDIR 'System32'
          $dlls = @(
            'api-ms-win-crt-runtime-l1-1-0.dll',
            'api-ms-win-crt-stdio-l1-1-0.dll'
          )
          foreach ($d in $dlls) {
            Write-Host "$d exists in System32: $(Test-Path (Join-Path $system32 $d))"
          }
  

      - name: Install Swift (winget)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "=== winget version ==="
          winget --version

          Write-Host "=== updating winget sources ==="
          winget source update

          if ('${{ matrix.swift }}' -eq 'latest') {
            Write-Host "Installing Swift.Toolchain (latest)..."
            winget install --id Swift.Toolchain -e --accept-source-agreements --accept-package-agreements
          } else {
            Write-Host "Installing Swift.Toolchain version ${{ matrix.swift }} ..."
            winget install --id Swift.Toolchain -e --version '${{ matrix.swift }}' --accept-source-agreements --accept-package-agreements
          }

        # ✅ GEÄNDERT: bessere Diagnose + korrektes Fail bei swift exitcode
      - name: Locate swift and add to PATH (fail if not found)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
      
          Write-Host "=== Check swift in PATH (where.exe) ==="
          & where.exe swift 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "swift already on PATH"
            & swift --version
            $code = $LASTEXITCODE
            Write-Host "swift exit code: $code"
            if ($code -ne 0) { exit $code }
            exit 0
          }
      
          Write-Host "swift not on PATH - searching toolchain install locations..."
      
          $roots = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Swift\Toolchains'),
            'C:\Users\runneradmin\AppData\Local\Programs\Swift\Toolchains',
            'C:\Library\Developer\Toolchains',
            (Join-Path $env:ProgramFiles 'Swift')
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
      
          $foundBin = $null
      
          foreach ($root in $roots) {
            Write-Host "Searching: $root"
            Get-ChildItem $root -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $candidate = Join-Path $_.FullName 'usr\bin'
              if (Test-Path $candidate) {
                $foundBin = $candidate
                Write-Host "Found candidate bin: $foundBin"
              }
            }
            if ($foundBin) { break }
          }
      
          if (-not $foundBin) {
            Write-Error "ERROR: swift toolchain bin not found under expected locations."
            Write-Host "Tried roots:"
            $roots | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
      
          if (-not $env:GITHUB_PATH) {
            Write-Error "ERROR: GITHUB_PATH is not set."
            exit 1
          }
      
          Add-Content -Path $env:GITHUB_PATH -Value $foundBin
          $env:PATH = "$foundBin;$env:PATH"

          # Add additional loader paths that often contain required DLLs
          $usrDir  = Split-Path $foundBin -Parent          # ...\usr
          $libDir  = Join-Path $usrDir 'lib'               # ...\usr\lib
          $swiftWinLibDir = Join-Path $libDir 'swift\windows'  # ...\usr\lib\swift\windows
          
          $extra = @($libDir, $swiftWinLibDir) | Where-Object { Test-Path $_ } | Select-Object -Unique
          foreach ($p in $extra) {
            Write-Host "Adding loader PATH: $p"
            Add-Content -Path $env:GITHUB_PATH -Value $p   # for subsequent steps
            $env:PATH = "$p;$env:PATH"                     # for this step
          }
          
          Write-Host "=== Quick check for ICU / runtime DLLs ==="
          Get-ChildItem $libDir -Filter "icu*.dll" -ErrorAction SilentlyContinue |
            Select-Object -First 20 Name, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Host

      
          Write-Host "=== where swift (after PATH add) ==="
          & where.exe swift
      
          Write-Host "=== swift resolved path ==="
          $swiftExe = (Get-Command swift -ErrorAction SilentlyContinue)?.Source
          Write-Host "swift resolved to: $swiftExe"
      
          Write-Host "=== List toolchain DLLs next to swift.exe (first 50) ==="
          Get-ChildItem $foundBin -Filter *.dll -ErrorAction SilentlyContinue |
            Select-Object -First 50 Name, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
         
          # --- verify & add likely DLL locations (and log them) ---
          $usrDir = Split-Path $foundBin -Parent                 # ...\usr
          $libDir = Join-Path $usrDir 'lib'                      # ...\usr\lib
          $swiftWinLibDir = Join-Path $libDir 'swift\windows'    # ...\usr\lib\swift\windows
          
          Write-Host "=== Toolchain paths ==="
          Write-Host "usrDir:          $usrDir (exists=$(Test-Path $usrDir))"
          Write-Host "libDir:          $libDir (exists=$(Test-Path $libDir))"
          Write-Host "swiftWinLibDir:  $swiftWinLibDir (exists=$(Test-Path $swiftWinLibDir))"
          
          $extra = @($libDir, $swiftWinLibDir) | Where-Object { Test-Path $_ } | Select-Object -Unique
          foreach ($p in $extra) {
            Write-Host "Adding loader PATH: $p"
            Add-Content -Path $env:GITHUB_PATH -Value $p
            $env:PATH = "$p;$env:PATH"
          }
          
          Write-Host "=== swift --version ==="
          & swift --version
          $code = $LASTEXITCODE
          Write-Host "swift exit code: $code"
          
          if ($code -ne 0) {
            Write-Host "=== swift failed; dumpbin /DEPENDENTS to identify missing DLLs ==="
            Write-Host "=== Check presence of key runtime DLLs ==="
          

            # locate vswhere
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (-not (Test-Path $vswhere)) {
              Write-Error "vswhere.exe not found at expected location: $vswhere"
              exit $code
            }
          
            $vsInstallPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            Write-Host "VS installationPath: $vsInstallPath"
          
            if (-not $vsInstallPath -or -not (Test-Path $vsInstallPath)) {
              Write-Error "Visual Studio installation path not found (vswhere returned empty)."
              exit $code
            }
          
            # find dumpbin.exe (prefer Hostx64\x64)
            $dumpbin = Get-ChildItem -Path (Join-Path $vsInstallPath 'VC\Tools\MSVC') `
              -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match '\\bin\\Hostx64\\x64\\dumpbin\.exe$'
              } |
              Select-Object -First 1 -ExpandProperty FullName
            
            if (-not $dumpbin) {
              Write-Error "dumpbin.exe (Hostx64\\x64) not found under VS install."
              exit 1
            }
            
            Write-Host "Using dumpbin: $dumpbin"

          
            if (-not $dumpbin) {
              Write-Error "dumpbin.exe not found under: $vsInstallPath\VC\Tools\MSVC"
              exit $code
            }
          
            Write-Host "dumpbin: $dumpbin"
            Write-Host "swiftExe: $swiftExe"
          
            & $dumpbin /DEPENDENTS $swiftExe
            $system32 = Join-Path $env:WINDIR 'System32'
            $syswow64 = Join-Path $env:WINDIR 'SysWOW64'
            
            $runtimeDlls = @(
              'VCRUNTIME140.dll',
              'api-ms-win-crt-runtime-l1-1-0.dll',
              'api-ms-win-crt-heap-l1-1-0.dll',
              'api-ms-win-crt-math-l1-1-0.dll',
              'api-ms-win-crt-stdio-l1-1-0.dll',
              'api-ms-win-crt-locale-l1-1-0.dll'
            )
            
            foreach ($d in $runtimeDlls) {
              $p1 = Join-Path $system32 $d
              $p2 = Join-Path $syswow64 $d
              Write-Host ("{0,-35} System32={1}  SysWOW64={2}" -f $d, (Test-Path $p1), (Test-Path $p2))
            }
            # hard fail (as requested)
            exit $code
          }

          Write-Host "=== Try running swift --version (capture exit code reliably) ==="
          $code = 0
          try {
            & swift --version
            $code = $LASTEXITCODE
          } catch {
            Write-Host "caught: $($_.Exception.Message)"
            # If swift crashed before setting LASTEXITCODE, treat as failure:
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { $code = $LASTEXITCODE } else { $code = 1 }
          }
      
          Write-Host "swift exit code (LASTEXITCODE): $LASTEXITCODE"
          Write-Host "swift exit code (code var): $code"
      
          if ($code -ne 0) {
            Write-Error "Swift is present but failed to run (exit=$code)."
            exit $code
          }


      - name: build package
        shell: pwsh
        run: swift build

      - name: test package
        shell: pwsh
        run: swift test
