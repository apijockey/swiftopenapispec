name: Swift on Windows
on:
  push:
    branches: ["main"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: read
jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.2
    with:
      license_header_check_project_name: "swiftopenapispec"
      license_header_check_enabled: false
      unacceptable_language_check_enabled: true
      api_breakage_check_enabled: false
      format_check_enabled: false
      shell_check_enabled: false
  release-windows:
    if: vars.RUN_WINDOWS_TESTS == 'true'
    runs-on: windows-latest
    needs: [soundness]
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift build & tests in Windows container
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = "swift:windowsservercore-ltsc2022"
          docker pull $image
          docker run --rm `
            -v "${{ github.workspace }}:C:\src" `
            -w "C:\src" `
            $image `
            cmd /c "swift build -c release --product SwiftOpenAPICLI && strip .build\release\SwiftOpenAPICLI.exe"
            docker create --name temp $image
            docker cp temp:"C:\src\.build\release\SwiftOpenAPICLI.exe" .
            docker rm temp
            shasum -a 256 SwiftOpenAPICLI.exe > SwiftOpenAPICLI.sha256
      - name: upload artifact
        uses: actions/upload-artifact@v4 
        with:
          name: windows-cli
          path: |
            SwiftOpenAPICLI
            SwiftOpenAPICLI.sha256