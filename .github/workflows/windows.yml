name: Swift on Windows
on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: read

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.2
    with:
      license_header_check_project_name: "swiftopenapispec"
      license_header_check_enabled: false
      unacceptable_language_check_enabled: true
      api_breakage_check_enabled: false
      format_check_enabled: false
      shell_check_enabled: false
  wtest:
    runs-on: windows-latest
    steps:
      - name: Run tests in Swift Windows container
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
      
          # Pick a Swift tag that exists for windowsservercore-ltsc2022.
          # Example shown; adjust tag to what you want to test.
          $image = "ghcr.io/swiftlang/swift:6.2.3-windowsservercore-ltsc2022"
          - name: Login to GHCR
          shell: pwsh
          run: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          docker pull $image
      
          # Run swift in container; mount repo into C:\src
          docker run --rm `
            -v "${{ github.workspace }}:C:\src" `
            -w "C:\src" `
            $image `
            cmd /c "swift --version && swift build && swift test"
