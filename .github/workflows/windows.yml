name: Swift on Windows
on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.2
    with:
      license_header_check_project_name: "swiftopenapispec"
      license_header_check_enabled: false
      unacceptable_language_check_enabled: true
      api_breakage_check_enabled: false
      format_check_enabled: false
      shell_check_enabled: false

  wtest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        swift: [latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Visual Studio components required by Swift
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Installing Visual Studio components required by Swift..."
          winget install `
            --id Microsoft.VisualStudio.2022.Community `
            --exact `
            --force `
            --accept-source-agreements `
            --accept-package-agreements `
            --custom "--add Microsoft.VisualStudio.Component.Windows11SDK.22621 --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.VC.Tools.ARM64"

      # ✅ NEU: VC++ Runtime (oft nötig, damit swift.exe startet)
      - name: Install VC++ Redistributable (runtime)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          winget install --id Microsoft.VCRedist.2015+.x64 -e --accept-source-agreements --accept-package-agreements

      - name: Install Swift (winget)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "=== winget version ==="
          winget --version

          Write-Host "=== updating winget sources ==="
          winget source update

          if ('${{ matrix.swift }}' -eq 'latest') {
            Write-Host "Installing Swift.Toolchain (latest)..."
            winget install --id Swift.Toolchain -e --accept-source-agreements --accept-package-agreements
          } else {
            Write-Host "Installing Swift.Toolchain version ${{ matrix.swift }} ..."
            winget install --id Swift.Toolchain -e --version '${{ matrix.swift }}' --accept-source-agreements --accept-package-agreements
          }

      # ✅ GEÄNDERT: bessere Diagnose + korrektes Fail bei swift exitcode
      - name: Locate swift and add to PATH (fail if not found)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "=== Check swift in PATH (where.exe) ==="
          & where.exe swift 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "swift already on PATH"
            & swift --version
            $code = $LASTEXITCODE
            Write-Host "swift exit code: $code"
            if ($code -ne 0) { exit $code }
            exit 0
          }

          Write-Host "swift not on PATH - searching toolchain install locations..."

          $roots = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Swift\Toolchains'),
            'C:\Users\runneradmin\AppData\Local\Programs\Swift\Toolchains',
            'C:\Library\Developer\Toolchains',
            (Join-Path $env:ProgramFiles 'Swift')
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          $foundBin = $null

          foreach ($root in $roots) {
            Write-Host "Searching: $root"
            Get-ChildItem $root -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $candidate = Join-Path $_.FullName 'usr\bin'
              if (Test-Path $candidate) {
                $foundBin = $candidate
                Write-Host "Found candidate bin: $foundBin"
              }
            }
            if ($foundBin) { break }
          }

          if (-not $foundBin) {
            Write-Error "ERROR: swift toolchain bin not found under expected locations."
            Write-Host "Tried roots:"
            $roots | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

          if (-not $env:GITHUB_PATH) {
            Write-Error "ERROR: GITHUB_PATH is not set."
            exit 1
          }

          Add-Content -Path $env:GITHUB_PATH -Value $foundBin
          $env:PATH = "$foundBin;$env:PATH"

          Write-Host "=== where swift (after PATH add) ==="
          & where.exe swift

          Write-Host "=== swift resolved path ==="
          $swiftExe = (Get-Command swift -ErrorAction SilentlyContinue)?.Source
          Write-Host "swift resolved to: $swiftExe"

          Write-Host "=== swift --version ==="
          & swift --version
          $code = $LASTEXITCODE
          Write-Host "swift exit code: $code"
          if ($code -ne 0) {
            Write-Error "Swift is present but failed to run (exit=$code)."
            exit $code
          }

      - name: build package
        shell: pwsh
        run: swift build

      - name: test package
        shell: pwsh
        run: swift test
