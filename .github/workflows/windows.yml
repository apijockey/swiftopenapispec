name: Swift on Windows
on: 
  push
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: read

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.2
    with:
      license_header_check_project_name: "swiftopenapispec"
      license_header_check_enabled: false
      unacceptable_language_check_enabled: true
      api_breakage_check_enabled: false
      format_check_enabled: false
      shell_check_enabled: false
  wtest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift build & tests in Windows container
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = "swift:windowsservercore-ltsc2022"
          docker pull $image
          docker run --rm `
            -v "${{ github.workspace }}:C:\src" `
            -w "C:\src" `
            $image `
            cmd /c "swift --version && swift build && swift test"
